<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Journal - Trader Frost">
    <title>Journal | Trader Frost</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="icon" type="image/png" href="../../assets/images/logos/Logo.png">
</head>

<body>
    <!-- Page Loader -->
    <div id="pageLoader" class="page-loader">
        <div class="loader-content">
            <div class="loader-logo">
                <img src="../../assets/images/logos/Logo.png" alt="Trader Frost Logo">
            </div>
            <div class="loader-text">
                <span style="color: #fff; font-size: 1.5rem; font-weight: bold;">
                    Trader<span style="color: #FF9933;">Frost</span>
                </span>
            </div>
            <div class="loader-spinner">
                <div class="spinner-ring"></div>
                <div class="spinner-ring"></div>
                <div class="spinner-ring"></div>
            </div>
        </div>
    </div>

    <!-- Page Wrapper -->
    <div class="page-wrapper">
        <!-- Sidebar Overlay (Mobile) -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Dashboard Section -->
        <div class="dashboard">
            <!-- Sidebar -->
            <aside class="dashboard__sidebar" id="dashboardSidebar">
                <div class="sidebar-brand">
                    <img src="../../assets/images/logos/Logo.png" alt="Trader Frost Logo">
                    <div class="sidebar-brand-text">
                        <span class="sidebar-brand-title">Trader<span>Frost</span></span>
                        <span class="sidebar-brand-tagline">Trade smart, Earn smartly</span>
                    </div>
                </div>
                <nav>
                    <ul class="sidebar-menu">
                        <li><a href="dashboard.html">Dashboard</a></li>
                        <li><a href="trades.html">Trades</a></li>
                        <li><a href="journal.html" class="active">Journal</a></li>
                        <li><a href="analysis.html">Analysis</a></li>
                        <li><a href="market.html">Market</a></li>
                        <li><a href="tools.html">Tools</a></li>
                    </ul>
                </nav>
            </aside>

            <!-- Main Content -->
            <div class="dashboard__main">
                <!-- Dashboard Toolbar -->
                <header class="dashboard__toolbar">
                    <!-- Left: Hamburger + Title -->
                    <div class="toolbar-left">
                        <button class="hamburger-menu" id="hamburgerMenu" title="Menu" aria-label="Toggle menu">
                            <span></span>
                            <span></span>
                            <span></span>
                        </button>
                        <h2 class="toolbar-title">Journal</h2>
                    </div>

                    <!-- Center: Search Bar -->
                    <div class="toolbar-center">
                        <div class="search-bar">
                            <span class="search-icon" aria-hidden="true">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <path d="m21 21-4.35-4.35"></path>
                                </svg>
                            </span>
                            <input type="text" class="search-input" placeholder="Search…">
                        </div>
                    </div>

                    <!-- Right: Action Buttons -->
                    <div class="toolbar-right">
                        <button class="toolbar-btn toolbar-btn-action" title="Add">+</button>
                        <div class="toolbar-time" id="toolbarDateTime">--</div>
                        <div class="toolbar-avatar">U</div>
                    </div>
                </header>

                <!-- Journal Content -->
                <section class="dashboard__content">
                    <div class="journal-container">
                        <!-- Left: Trade List -->
                        <div class="journal-trades-panel">
                            <h3 class="panel-title">Trade List</h3>
                            <div class="trades-filter-box">
                                <input type="text" id="tradeSearchInput" class="search-input" placeholder="Search trades...">
                                <select id="tradeStatusFilter" class="filter-select">
                                    <option value="">All</option>
                                    <option value="journaled">Journaled</option>
                                    <option value="pending">Pending</option>
                                </select>
                            </div>
                            <div id="tradesList" class="trades-list">
                                <!-- Trades will be loaded here -->
                            </div>
                        </div>

                        <!-- Right: Journal Form -->
                        <div class="journal-form-panel">
                            <h3 class="panel-title">Trade Journal</h3>
                            <div id="noTradeSelected" class="no-trade-message">
                                <p>👈 Select a trade to add journal entry</p>
                            </div>
                            <form id="journalForm" class="journal-form" style="display: none;">
                                <div class="form-group">
                                    <label>Trade Details</label>
                                    <div class="trade-details-box">
                                        <div class="detail-row">
                                            <span class="detail-label">Symbol:</span>
                                            <span id="selectedSymbol" class="detail-value">--</span>
                                        </div>
                                        <div class="detail-row">
                                            <span class="detail-label">Type:</span>
                                            <span id="selectedType" class="detail-value">--</span>
                                        </div>
                                        <div class="detail-row">
                                            <span class="detail-label">Entry Price:</span>
                                            <span id="selectedEntry" class="detail-value">--</span>
                                        </div>
                                        <div class="detail-row">
                                            <span class="detail-label">Exit Price:</span>
                                            <span id="selectedExit" class="detail-value">--</span>
                                        </div>
                                        <div class="detail-row">
                                            <span class="detail-label">P&L:</span>
                                            <span id="selectedPnL" class="detail-value">--</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label for="whyTook">Why did you take this trade?</label>
                                    <textarea id="whyTook" class="form-textarea" placeholder="Explain your reasons for entering this trade..." rows="5" required></textarea>
                                </div>

                                <div class="form-group">
                                    <label for="whyExit">Why did you exit this trade?</label>
                                    <textarea id="whyExit" class="form-textarea" placeholder="Explain why you exited (if closed)..." rows="4"></textarea>
                                </div>

                                <div class="form-group">
                                    <label for="lessonsLearned">Lessons Learned</label>
                                    <textarea id="lessonsLearned" class="form-textarea" placeholder="What did you learn from this trade?" rows="4" required></textarea>
                                </div>

                                <div class="form-group">
                                    <label for="improvements">Areas for Improvement</label>
                                    <textarea id="improvements" class="form-textarea" placeholder="What could you have done better?" rows="3"></textarea>
                                </div>

                                <div class="form-actions">
                                    <button type="submit" class="btn btn-primary">Save Journal Entry</button>
                                    <button type="button" class="btn btn-secondary" onclick="clearForm()">Clear</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </section>
            </div>
        </div>

    </div>

    <script src="../../js/dashboard.js"></script>
    <script src="../../js/journal.js"></script>
    <script src="../../js/sidebar-toggle.js"></script>
</body>

</html>
